<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cooking List">
<title>Cooking List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header>
    <h1 id="listToggle">Cooking List</h1>
  </header>

  <div class="layout">

    <!-- ============ LEFT PANEL ============ -->
    <div class="panel">
      <div class="list-content" id="listContent">
        <div class="add-form">
          <div class="name-field-wrap">
            <div class="name-field">
              <input type="text" id="newDish" placeholder="Add a dish" autocomplete="new-password" spellcheck="false">
              <button class="enter-btn" id="addBtn" type="button" title="Add dish" aria-label="Add dish">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>
              </button>
            </div>
            <p id="dishError" class="form-error"></p>
          </div>
          <select id="newCat"></select>
          <button class="edit-cats-btn" id="editCatsBtn" type="button">Edit cuisines</button>
        </div>

        <!-- JS toggles a "show" class on this to reveal/hide it -->
        <div class="edit-cats-panel" id="editCatsPanel">
          <div class="newcat-row show">
            <input type="text" id="newCatInput" placeholder="Add a Cuisine" autocomplete="new-password" spellcheck="false">
            <button id="saveNewCat" type="button">Add</button>
          </div>
          <p id="catError" class="form-error"></p>
          <!-- JS fills this with the list of cuisines + delete buttons -->
          <div id="catManageList"></div>
        </div>

        <!-- JS fills this with the All / Mexican / Italian... tab buttons -->
        <div class="tabs" id="tabs"></div>

        <!-- JS fills this with the actual recipe checklist, grouped by cuisine -->
        <div id="groups"></div>
      </div>
    </div>

    <!-- ============ RIGHT PANEL ============ -->
    <div class="panel week-panel">
      <h2>Cooking this week</h2>
      <p class="week-count" id="weekCount">Nothing checked yet</p>
      <!-- JS fills this with whichever dishes are currently checked -->
      <div id="weekList"></div>

      <hr class="panel-divider">

      <h2>Recently cooked</h2>
      <p class="week-count" id="recentCount">Nothing here yet</p>
      <!-- JS fills this with dishes recently taken out of "this week" -->
      <div id="recentList"></div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
